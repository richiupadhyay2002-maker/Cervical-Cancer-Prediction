# Run from the repository root after `python run_pipeline.py`:
#
#   docker compose -f docker/cervical_docker-compose.yml up --build
#
# MLflow stores absolute artifact paths in notebooks/mlflow.db, so the project's
# notebooks/ directory is mounted at the same absolute path inside the containers.
# PROJECT_DIR defaults to the current directory (the repository root).

services:
  api:
    build:
      context: ..
      dockerfile: docker/cervical_Dockerfile
    container_name: cervical-cancer-api
    ports:
      - "8000:8000"
    volumes:
      # read-write: MLflow writes registered_model_meta when loading a model
      - ${PROJECT_DIR:-${PWD}}/notebooks:${PROJECT_DIR:-${PWD}}/notebooks
      - ${PROJECT_DIR:-${PWD}}/processed_data/feature_columns.json:/app/feature_columns.json:ro
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///${PROJECT_DIR:-${PWD}}/notebooks/mlflow.db
      - MODEL_NAME=${MODEL_NAME:-Gradient_Boosting}
      - MODEL_STAGE=Production
      - FEATURE_COLUMNS_PATH=/app/feature_columns.json
      - RELOAD=false
    restart: unless-stopped

  mlflow-ui:
    image: python:3.13-slim
    container_name: cervical-cancer-mlflow-ui
    ports:
      - "5000:5000"
    volumes:
      - ${PROJECT_DIR:-${PWD}}/notebooks:${PROJECT_DIR:-${PWD}}/notebooks
    command: >
      bash -c "pip install --no-cache-dir mlflow==2.22.5 'sqlalchemy<2.1' &&
      mlflow ui --backend-store-uri sqlite:///${PROJECT_DIR:-${PWD}}/notebooks/mlflow.db
      --host 0.0.0.0 --port 5000"
    restart: unless-stopped
